{% load static %}
<!DOCTYPE html>
<html lang="en" data-mode="{{ s.default_mode }}" data-color="{{ s.default_color }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ s.site_title }}{% endblock %}</title>
  {% if s.meta_description %}<meta name="description" content="{{ s.meta_description }}">{% endif %}
  {% if user.is_staff %}<meta name="csrf-token" content="{{ csrf_token }}"><meta name="color-url" content="{% url 'set_color' %}">{% endif %}
  <script>
    /* visitors may pick light/dark; the colour theme is set by the admin only */
    try { var m = localStorage.getItem("mode"); if (m) document.documentElement.dataset.mode = m; localStorage.removeItem("color"); } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'portfolio/css/style.css' %}">
</head>
<body>
  {% include "portfolio/_nav.html" %}
  <main>{% block content %}{% endblock %}</main>
  {% include "portfolio/_footer.html" %}
  <script src="{% static 'portfolio/js/main.js' %}"></script>
</body>
</html>
